# ====================================================================
# ESP32-S2 (S2 Mini / DevKit) Secondary MCU & ADXL345 Config
# ====================================================================
# Add to your printer.cfg:
#   [include configs/adxl_esp32_s2.cfg]
#
# Wiring Reference (ESP32-S2 to ADXL345):
#   ADXL345 VCC  --> ESP32-S2 3.3V
#   ADXL345 GND  --> ESP32-S2 GND
#   ADXL345 CS   --> ESP32-S2 GPIO 10
#   ADXL345 SCL  --> ESP32-S2 GPIO 12 (SCK)
#   ADXL345 SDA  --> ESP32-S2 GPIO 11 (MOSI)
#   ADXL345 SDO  --> ESP32-S2 GPIO 13 (MISO)
#
# NOTE: Do NOT use GPIO 19 or GPIO 20 (they are native USB lines on S2).
# ====================================================================

[mcu esp32]
# On your Linux machine, find the serial port by running: ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-Espressif_ESP32_S2_48:f6:ee:7a:2a:c0-if00

[adxl345]
cs_pin: esp32:gpio10
spi_software_sclk_pin: esp32:gpio12
spi_software_mosi_pin: esp32:gpio11
spi_software_miso_pin: esp32:gpio13

[resonance_tester]
accel_chip: adxl345
# Set to your bed center (X, Y, Z):
probe_points:
    117.5, 117.5, 20

# --------------------------------------------------------------------
# Helper Macros
# --------------------------------------------------------------------
[gcode_macro TEST_ACCEL]
gcode:
    ACCELEROMETER_QUERY CHIP=adxl345

[gcode_macro TEST_NOISE]
gcode:
    MEASURE_AXES_NOISE

[gcode_macro TEST_RESONANCE_X]
gcode:
    TEST_RESONANCES AXIS=X

[gcode_macro TEST_RESONANCE_Y]
gcode:
    TEST_RESONANCES AXIS=Y

