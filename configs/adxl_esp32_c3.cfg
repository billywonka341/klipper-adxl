# ====================================================================
# ESP32-C3 (C3 SuperMini / Mini / DevKit) Secondary MCU & ADXL345 Config
# ====================================================================
# Add to your printer.cfg:
#   [include configs/adxl_esp32_c3.cfg]
#
# Wiring Reference (ESP32-C3 SuperMini to ADXL345):
#   ADXL345 VCC  --> ESP32-C3 3.3V
#   ADXL345 GND  --> ESP32-C3 GND
#   ADXL345 CS   --> ESP32-C3 GPIO 7
#   ADXL345 SCL  --> ESP32-C3 GPIO 4 (SCK)
#   ADXL345 SDA  --> ESP32-C3 GPIO 6 (MOSI)
#   ADXL345 SDO  --> ESP32-C3 GPIO 5 (MISO)
#
# NOTE: Avoid GPIO 18 and GPIO 19 (native USB data lines on C3).
# ====================================================================

[mcu esp32]
# On your Linux machine, find the serial port by running: ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_1234567890-if00

[adxl345]
cs_pin: esp32:gpio7
spi_software_sclk_pin: esp32:gpio4
spi_software_mosi_pin: esp32:gpio6
spi_software_miso_pin: esp32:gpio5

[resonance_tester]
accel_chip: adxl345
# Set to your bed center (X, Y, Z):
probe_points:
    117.5, 117.5, 20

# --------------------------------------------------------------------
# Helper Macros
# --------------------------------------------------------------------
[gcode_macro TEST_ACCEL]
gcode:
    ACCELEROMETER_QUERY CHIP=adxl345

[gcode_macro TEST_NOISE]
gcode:
    MEASURE_AXES_NOISE

[gcode_macro TEST_RESONANCE_X]
gcode:
    TEST_RESONANCES AXIS=X

[gcode_macro TEST_RESONANCE_Y]
gcode:
    TEST_RESONANCES AXIS=Y

