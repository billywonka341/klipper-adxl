# ====================================================================
# Classic ESP32 (WROOM-32 / DevKit v1) Secondary MCU & ADXL345 Config
# ====================================================================
# Add to your printer.cfg:
#   [include configs/adxl_esp32_classic.cfg]
#
# Wiring Reference (Classic ESP32 to ADXL345):
#   ADXL345 VCC  --> ESP32 3.3V
#   ADXL345 GND  --> ESP32 GND
#   ADXL345 CS   --> ESP32 GPIO 5
#   ADXL345 SCL  --> ESP32 GPIO 18 (VSPI SCK)
#   ADXL345 SDA  --> ESP32 GPIO 23 (VSPI MOSI)
#   ADXL345 SDO  --> ESP32 GPIO 19 (VSPI MISO)
# ====================================================================

[mcu esp32]
# On your Linux machine, find the serial port by running: ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_0001-if00-port0
baud: 250000

[adxl345]
cs_pin: esp32:gpio5
spi_software_sclk_pin: esp32:gpio18
spi_software_mosi_pin: esp32:gpio23
spi_software_miso_pin: esp32:gpio19

[resonance_tester]
accel_chip: adxl345
# Set to your bed center (X, Y, Z):
probe_points:
    117.5, 117.5, 20

# --------------------------------------------------------------------
# Helper Macros
# --------------------------------------------------------------------
[gcode_macro TEST_ACCEL]
gcode:
    ACCELEROMETER_QUERY CHIP=adxl345

[gcode_macro TEST_NOISE]
gcode:
    MEASURE_AXES_NOISE

[gcode_macro TEST_RESONANCE_X]
gcode:
    TEST_RESONANCES AXIS=X

[gcode_macro TEST_RESONANCE_Y]
gcode:
    TEST_RESONANCES AXIS=Y

