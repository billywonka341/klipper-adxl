# ====================================================================
# ESP32-S3 (S3 Zero / S3 Mini / DevKit) Secondary MCU & ADXL345 Config
# ====================================================================
# Add to your printer.cfg:
#   [include configs/adxl_esp32_s3.cfg]
#
# Wiring Reference (ESP32-S3 to ADXL345):
#   ADXL345 VCC  --> ESP32-S3 3.3V
#   ADXL345 GND  --> ESP32-S3 GND
#   ADXL345 CS   --> ESP32-S3 GPIO 10
#   ADXL345 SCL  --> ESP32-S3 GPIO 12 (SCK)
#   ADXL345 SDA  --> ESP32-S3 GPIO 11 (MOSI)
#   ADXL345 SDO  --> ESP32-S3 GPIO 13 (MISO)
#
# NOTE: Avoid GPIO 19 and GPIO 20 (native USB-JTAG data lines on S3).
# ====================================================================

[mcu esp32]
# On your Linux machine, find the serial port by running: ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_1234567890-if00

[adxl345]
cs_pin: esp32:gpio10
spi_software_sclk_pin: esp32:gpio12
spi_software_mosi_pin: esp32:gpio11
spi_software_miso_pin: esp32:gpio13

[resonance_tester]
accel_chip: adxl345
# Set to your bed center (X, Y, Z):
probe_points:
    117.5, 117.5, 20

# --------------------------------------------------------------------
# Helper Macros
# --------------------------------------------------------------------
[gcode_macro TEST_ACCEL]
gcode:
    ACCELEROMETER_QUERY CHIP=adxl345

[gcode_macro TEST_NOISE]
gcode:
    MEASURE_AXES_NOISE

[gcode_macro TEST_RESONANCE_X]
gcode:
    TEST_RESONANCES AXIS=X

[gcode_macro TEST_RESONANCE_Y]
gcode:
    TEST_RESONANCES AXIS=Y

